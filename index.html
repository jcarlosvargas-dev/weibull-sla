@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');
.noc-root, .noc-root * { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
.noc-grid { background-image: linear-gradient(rgba(34,211,238,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.04) 1px, transparent 1px); background-size: 32px 32px; }
.noc-scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); }
.noc-panel { box-shadow: inset 0 0 0 1px rgba(255,255,255,.02), 0 0 24px rgba(0,0,0,.4); }
.noc-glow-red { text-shadow: 0 0 12px rgba(239,68,68,.75); }
.noc-glow-orange { text-shadow: 0 0 14px rgba(249,115,22,.55); }
.noc-glow-green { text-shadow: 0 0 14px rgba(16,185,129,.6); }
@keyframes nocBlink { 0%,100% { opacity: 1; box-shadow: 0 0 22px rgba(239,68,68,.9);} 50% { opacity: .35; box-shadow: 0 0 2px rgba(239,68,68,.2);} }
.noc-blink { animation: nocBlink .8s steps(2, jump-none) infinite; }
@keyframes nocBlinkSoft { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
.noc-blink-soft { animation: nocBlinkSoft 1.4s ease-in-out infinite; }
@keyframes nocLed { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
.noc-led { animation: nocLed 1.8s ease-in-out infinite; }
@keyframes nocPulseRed { 0%,100% { box-shadow: 0 0 0 rgba(239,68,68,0);} 50% { box-shadow: 0 0 26px rgba(239,68,68,.55);} }
.noc-pulse-red { animation: nocPulseRed 1.6s ease-in-out infinite; }
@keyframes nocMount { from { opacity: 0; transform: translateY(12px) scale(.985); filter: blur(4px);} to { opacity: 1; transform: none; filter: none;} }
.noc-mount { animation: nocMount .6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes nocFade { from { opacity: 0 } to { opacity: 1 } }
.noc-fade-in { animation: nocFade .6s ease both; }
@keyframes nocFlash { 0% { background: rgba(34,211,238,.06);} 100% { background: transparent;} }
.noc-flash { animation: nocFlash .45s ease-out both; }
@keyframes nocType { from { clip-path: inset(0 100% 0 0);} to { clip-path: inset(0 0 0 0);} }
.noc-type { animation: nocType .7s steps(40) both; }
.noc-strike { position: relative; display: inline-block; }
.noc-strike::after { content: ""; position: absolute; left: -4px; right: -4px; top: 55%; height: 2px; background: #ef4444; box-shadow: 0 0 8px #ef4444; transform: scaleX(0) rotate(-12deg); transform-origin: left; transition: transform .6s ease .9s; }
.noc-cancel-on .noc-strike::after { transform: scaleX(1) rotate(-12deg); }
.noc-cancel-on .noc-strike { color: #64748b; transition: color .6s ease 1.2s; }
@keyframes nocPing { 0% { transform: scale(.6); opacity: .6 } 100% { transform: scale(1.8); opacity: 0 } }
.noc-ping { transform-box: fill-box; transform-origin: center; animation: nocPing 1.4s ease-out infinite; }
@keyframes nocDraw { from { stroke-dashoffset: 400; opacity: .2 } to { stroke-dashoffset: 0; opacity: 1 } }
@keyframes nocRubric { 0% { opacity: 0; transform: translateY(-8px) scale(.95); box-shadow: 0 0 0 rgba(249,115,22,0);} 60% { box-shadow: 0 0 34px rgba(249,115,22,.8);} 100% { opacity: 1; transform: none;} }
.noc-rubric { animation: nocRubric .7s cubic-bezier(.2,.8,.2,1) both; }
.noc-draw { stroke-dasharray: 6 4; animation: nocDraw 1.2s ease-out both; }
